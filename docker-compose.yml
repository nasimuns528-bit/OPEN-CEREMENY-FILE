version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: visiontrust_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-visiontrust}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visiontrust_secret}
      POSTGRES_DB: ${POSTGRES_DB:-visiontrust}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-visiontrust}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: visiontrust_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-visiontrust}:${POSTGRES_PASSWORD:-visiontrust_secret}@db:5432/${POSTGRES_DB:-visiontrust}
      DATABASE_SYNC_URL: postgresql+psycopg2://${POSTGRES_USER:-visiontrust}:${POSTGRES_PASSWORD:-visiontrust_secret}@db:5432/${POSTGRES_DB:-visiontrust}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: visiontrust_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
