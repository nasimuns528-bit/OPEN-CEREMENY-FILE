services:
  # ── Backend API (FastAPI) ─────────────────────────────────────────────────
  - type: web
    name: visiontrust-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: visiontrust-db
          property: connectionString
      - key: DATABASE_SYNC_URL
        fromDatabase:
          name: visiontrust-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: ALLOWED_ORIGINS
        value: https://visiontrust.netlify.app,http://localhost:5173
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: 50
      - key: FIRST_ADMIN_EMAIL
        value: admin@visiontrust.local
      - key: FIRST_ADMIN_USERNAME
        value: admin
      - key: FIRST_ADMIN_PASSWORD
        generateValue: true

  # ── PostgreSQL Database ───────────────────────────────────────────────────
databases:
  - name: visiontrust-db
    databaseName: visiontrust
    user: visiontrust
    plan: free
    region: oregon
